name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests des packages (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: swift test
        working-directory: Packages/ProRangeKit
        run: swift test --parallel

  ipa:
    name: App iPad non signée (.ipa)
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compiler pour iPadOS
        run: |
          xcodebuild build \
            -project ProRangeCreator.xcodeproj \
            -scheme ProRangeCreator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Empaqueter le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProRangeCreator.app Payload/
          zip -qry ProRangeCreator.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ProRangeCreator-ipa
          path: ProRangeCreator.ipa
          retention-days: 14
