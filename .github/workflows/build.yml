name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests des packages (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: swift test
        working-directory: Packages/ProRangeKit
        run: swift test --parallel --skip PerformanceBenchmarks
      # Seul, non parallèle et optimisé comme l'app (Release) : chronométrages réalistes (lignes « PERF »).
      - name: Banc d'essai de performance
        working-directory: Packages/ProRangeKit
        run: swift test -c release -Xswiftc -enable-testing --filter PerformanceBenchmarks

  ipa:
    name: App iPad non signée (.ipa)
    # Temporaire (voir DECISIONS.md) : arm64 saturé chez GitHub. Le .ipa se compile sur Intel (cible iOS arm64) sans
    # attendre les tests, qui ne tournent pas sur Mac Intel (pas de Float16 en x86_64).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compiler pour iPadOS
        run: |
          xcodebuild build \
            -project ProRangeCreator.xcodeproj \
            -scheme ProRangeCreator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Empaqueter le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProRangeCreator.app Payload/
          zip -qry ProRangeCreator.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ProRangeCreator-ipa
          path: ProRangeCreator.ipa
          # Dépôt public : l'.ipa ne reste téléchargeable qu'un jour (le temps de le récupérer).
          retention-days: 1
      # Temporaire : sans Mac arm64, on vérifie au moins que les tests compilent (pour iPad, sans les lancer).
      - name: Compiler les tests pour iPadOS
        working-directory: Packages/ProRangeKit
        run: |
          xcodebuild -list
          xcodebuild build-for-testing \
            -scheme ProRangeKit-Package \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build-tests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      # Le shader de la toile est compilé au lancement de l'app : on le compile ici pour voir une erreur avant l'iPad.
      - name: Compiler le shader de la toile
        run: |
          awk '/static let source = """/{on=1; next} on && /^    """/{exit} on' \
            Packages/ProRangeKit/Sources/PREngine/PanoramaShaders.swift > panorama.metal
          wc -l panorama.metal
          xcrun -sdk iphoneos metal -c panorama.metal -o panorama.air
